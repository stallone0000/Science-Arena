name: Build 2026 problem details

on:
  workflow_dispatch:
    inputs:
      inspect:
        description: Inspect sealed source coverage without publishing data
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-2026-problem-details
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install zstandard
      - name: Inspect source archives on the GitHub runner
        if: inputs.inspect
        run: python scripts/build_2026_details.py --inspect
      - name: Build verified public details
        if: '!inputs.inspect'
        run: |
          python scripts/build_2026_details.py
          python scripts/sync_2026.py
      - name: Publish generated data
        if: '!inputs.inspect'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/data/2026 static/data/manifest.json static/data/fallback.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified 2026 per-problem answers and scores'
          git push origin HEAD:main
